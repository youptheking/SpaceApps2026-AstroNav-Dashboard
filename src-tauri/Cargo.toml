[package]
name = "astronav-dashboard"
version = "0.1.0"
description = "AstroNav health dashboard for NASA Space Apps 2026"
authors = ["YoupSpace"]
edition = "2024"

[lib]
name = "astronav_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
uuid = "1"
